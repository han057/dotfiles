# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# create a new session (prompts for a session name)
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# move the current pane into another window (same session, by index or name)
bind j command-prompt -p "Move pane to window:" "join-pane -t ':%%'"

# move the current pane into another session (interactive picker)
bind J choose-tree -Zs "join-pane -t '%%'"

# move the current pane into a brand-new window in a different session
bind B command-prompt -p "Move pane to new window in session:" "break-pane -t '%%'"

# switch panes using Alt-arrow without prefix
bind -n M-a select-pane -L
bind -n M-f select-pane -R
bind -n M-d select-pane -U
bind -n M-s select-pane -D

# resize panes using Alt-Shift without prefix
bind -n M-A resize-pane -L 5
bind -n M-F resize-pane -R 5
bind -n M-D resize-pane -U 5
bind -n M-S resize-pane -D 5

# don't rename windows automatically
set-option -g allow-rename off

# refresh HYPRLAND_INSTANCE_SIGNATURE from the attaching client so existing
# panes can pick up the current instance after a Hyprland restart
set -ga update-environment ' HYPRLAND_INSTANCE_SIGNATURE'

set -g @continuum-restore 'on'

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'



# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "nordtheme/tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
